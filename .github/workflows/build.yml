name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        shell: pwsh
        run: |
          sdkmanager "build-tools;30.0.3" "platforms;android-33"

      - name: Build APK
        shell: pwsh
        run: ./app/build.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Old-Ai-Chat-APK
          path: app/bin/(OAC).apk
